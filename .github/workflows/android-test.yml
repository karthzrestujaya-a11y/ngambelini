# Launch-tests the NBN Android app on an emulator and saves logcat + a screenshot to the "android-test" branch.
name: Android launch test
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: playstore
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p out
            adb install -r $(find android/app/build/outputs/apk/debug -name "*.apk" | head -1) > out/install.txt 2>&1 || true
            adb shell pm list packages | grep -iE "chrome|browser|ngambelini" > out/packages.txt || true
            adb logcat -c
            adb shell am start -W -n com.ngambelini.app/.LauncherActivity > out/start.txt 2>&1 || true
            sleep 25
            adb exec-out screencap -p > out/screen.png || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > out/top.txt || true
            adb logcat -d > out/logcat.txt || true
      - name: Push results
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b android-test
          git config user.name "nbn-build"; git config user.email "build@ngambelini.com"
          git add -A && git commit -qm "Launch test $(date -u +%FT%TZ)" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-test
