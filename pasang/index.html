<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cara Pasang NBN – Ngam Beli Ni</title>
<meta name="description" content="Pasang NBN di telefon anda dalam 1 minit — Android dan iPhone.">
<link rel="icon" href="../icons/icon-192.png">
<style>
:root{--g:#14774A;--gd:#14563A;--gold:#C9A227;--ink:#14382A;--mut:#55645B;--bg:#FFFDF5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;align-items:center;gap:12px}.top img{width:48px;height:48px;border-radius:12px}.top b{font-size:18px}.top small{display:block;color:var(--mut);font-size:12px}
.lang{margin-left:auto;display:flex;border:1.5px solid var(--g);border-radius:20px;overflow:hidden}.lang button{border:0;background:#fff;color:var(--g);padding:6px 12px;font-weight:700;font-size:13px}.lang button.on{background:var(--g);color:#fff}
h1{color:var(--gd);font-size:24px;margin:20px 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--gold);background:#fff;font-weight:700;font-size:15px;color:var(--ink)}.tabs button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.step{display:flex;gap:12px;background:#fff;border:1.5px solid #ecdca5;border-radius:14px;padding:12px;margin-bottom:10px;align-items:flex-start}
.n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center}
.step b{display:block;font-size:15.5px}.step span{color:var(--mut);font-size:14px}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:#eef6f1;border:1px solid #cfe5d8;font-weight:800;color:var(--gd);vertical-align:middle}
.go{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:14px;margin:16px 0 8px;font-size:16px}
.note{background:#fff7dd;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#5b4a12}
.pdf{display:block;text-align:center;border:1.5px solid var(--g);color:var(--g);text-decoration:none;font-weight:700;padding:12px;border-radius:14px;margin:0 0 10px;font-size:15px;background:#fff}
.soon{text-align:center;color:var(--mut);font-size:13px;margin-top:14px}
[hidden]{display:none!important}
</style></head><body><div class="wrap">
<div class="top"><img src="../icons/icon-192.png" alt=""><div><b>NBN</b><small>Ngam Beli Ni</small></div>
<div class="lang"><button data-l="ms" class="on">BM</button><button data-l="en">EN</button></div></div>

<h1 data-ms="Pasang NBN dalam 1 minit" data-en="Install NBN in 1 minute"></h1>
<p class="sub" data-ms="Percuma. Tiada fail APK. Terus dari laman web." data-en="Free. No APK file. Straight from our website."></p>

<div class="tabs"><button data-os="and" class="on">🤖 Android</button><button data-os="ios">🍎 iPhone</button></div>

<div id="and">
<div class="step"><div class="n">1</div><div><b data-ms="Buka ngambelini.com dalam Chrome" data-en="Open ngambelini.com in Chrome"></b><span data-ms="Guna Google Chrome, bukan dalam TikTok atau Facebook." data-en="Use Google Chrome, not inside TikTok or Facebook."></span></div></div>
<div class="step"><div class="n">2</div><div><b data-ms="Tekan menu ⋮ di atas kanan" data-en="Tap the ⋮ menu, top right"></b><span data-ms="Tiga titik di sebelah alamat web." data-en="The three dots next to the web address."></span></div></div>
<div class="step"><div class="n">3</div><div><b data-ms="Pilih “Pasang aplikasi” atau “Tambah ke skrin utama”" data-en="Choose “Install app” or “Add to Home screen”"></b><span data-ms="Kemudian tekan Pasang / Tambah." data-en="Then tap Install / Add."></span></div></div>
<div class="step"><div class="n">4</div><div><b data-ms="Buka ikon NBN di skrin telefon" data-en="Open the NBN icon on your home screen"></b><span data-ms="Log masuk dengan e-mel anda. Siap!" data-en="Log in with your email. Done!"></span></div></div>
</div>

<div id="ios" hidden>
<div class="step"><div class="n">1</div><div><b data-ms="Buka ngambelini.com dalam Safari" data-en="Open ngambelini.com in Safari"></b><span data-ms="Mesti Safari, bukan dalam TikTok atau Facebook." data-en="Must be Safari, not inside TikTok or Facebook."></span></div></div>
<div class="step"><div class="n">2</div><div><b><span data-ms="Tekan butang Kongsi" data-en="Tap the Share button"></span> <span class="ic">⬆</span></b><span data-ms="Kotak dengan anak panah ke atas, di bawah skrin." data-en="The box with an up arrow, at the bottom of the screen."></span></div></div>
<div class="step"><div class="n">3</div><div><b data-ms="Pilih “Tambah ke Skrin Utama”" data-en="Choose “Add to Home Screen”"></b><span data-ms="Skrol ke bawah sedikit jika tak nampak. Tekan Tambah." data-en="Scroll down a little if you can't see it. Tap Add."></span></div></div>
<div class="step"><div class="n">4</div><div><b data-ms="Buka ikon NBN di skrin telefon" data-en="Open the NBN icon on your home screen"></b><span data-ms="Log masuk dengan e-mel anda. Siap!" data-en="Log in with your email. Done!"></span></div></div>
</div>

<a class="go" href="https://ngambelini.com/" data-ms="Buka ngambelini.com →" data-en="Open ngambelini.com →"></a>
<a class="pdf" id="pdf" href="../howto/NBN_guide_ms.pdf" target="_blank" data-ms="📄 Muat turun panduan cara guna (PDF)" data-en="📄 Download the how-to-use guide (PDF)"></a>
<a class="pdf" href="../howto/NBN_howto_ms.mp4" id="vid" target="_blank" data-ms="▶️ Tonton video cara guna (1 minit)" data-en="▶️ Watch the how-to video (1 min)"></a>
<div class="note" data-ms="💡 Buka dari TikTok/Facebook? Tekan ⋯ dan pilih “Buka dalam pelayar” (Chrome / Safari) dulu." data-en="💡 Came from TikTok/Facebook? Tap ⋯ and choose “Open in browser” (Chrome / Safari) first."></div>
<p class="soon" data-ms="📱 App Google Play &amp; App Store: akan datang 🔜" data-en="📱 Google Play &amp; App Store app: coming soon 🔜"></p>
</div>
<script>
const qs=new URLSearchParams(location.search);
function setL(l){document.documentElement.lang=l;document.querySelectorAll('[data-'+l+']').forEach(e=>e.innerHTML=e.getAttribute('data-'+l));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));try{localStorage.setItem('nbn-pasang-l',l)}catch(e){}document.getElementById('pdf').href='../howto/NBN_guide_'+l+'.pdf';document.getElementById('vid').href='../howto/NBN_howto_'+l+'.mp4';}
function setOS(o){document.getElementById('and').hidden=o!=='and';document.getElementById('ios').hidden=o!=='ios';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.os===o))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setL(b.dataset.l));
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setOS(b.dataset.os));
let l='ms';try{l=localStorage.getItem('nbn-pasang-l')||l}catch(e){}if(qs.get('l'))l=qs.get('l');setL(l==='en'?'en':'ms');
setOS(qs.get('os')||(/iPhone|iPad|iPod/.test(navigator.userAgent)?'ios':'and'));
</script></body></html>
